name: Natural Intelligence Systems
description: Natural Intelligence Semiconductor (Natural Intelligence Systems) is a fabless semiconductor
  startup founded in 2016 and headquartered in Boise, Idaho, led by founder and CEO Paul Dlugosch. The
  company is developing the Natural Neural Processor (NNP), a novel processor architecture inspired by the
  human neocortex to deliver disruptive performance for artificial intelligence and big-data analytics
  workloads. Its roadmap spans the chips, system boards, and a software tool chain of compilers, drivers,
  and low-level APIs needed to bring the NNP into customer systems. It exposes no public web API today;
  the developer surface is chip- and driver-level tooling. Added to the API Evangelist network as a
  Techstars portfolio lead.
